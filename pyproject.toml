[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waveshift"
version = "0.3.0"
description = "Physics-driven data augmentation by wavefront propagation"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Gent Imeraj" }, { name = "Hitoshi Iyatomi" }]
keywords = [
    "data-augmentation",
    "wavefront-propagation",
    "fine-grained-classification",
    "plant-disease",
    "fourier-optics",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pillow>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
examples = ["matplotlib>=3.4"]

[project.urls]
Repository = "https://github.com/IyatomiLab/Waveshift_Augmentation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
